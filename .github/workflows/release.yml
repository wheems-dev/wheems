name: Release

# Publishes to npm when a new version lands on main: merging a pull request that changes
# "version" in package.json (and adds its section to CHANGELOG.md) is the whole release.
# npm trusts this file through trusted publishing (OIDC), so no npm token is stored anywhere.
# The tag v<version> and a GitHub release with the changelog section follow the publish.
# A push to main whose version is already on npm and tagged does nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Is this a new version?
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.find.outputs.version }}
      publish: ${{ steps.find.outputs.publish }}
      tag: ${{ steps.find.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: find
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # npm view prints nothing (and fails) for a version that isn't published.
          if npm view "$name@$version" version 2>/dev/null | grep -qx "$version"; then
            publish=false
          else
            publish=true
          fi

          # The tag is pushed after a successful publish, so a tag means this version is done.
          # (npm can take a minute or two to show a version it has just accepted.)
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            if [ "$publish" = true ]; then
              echo "::warning::$tag exists but npm doesn't show $name@$version yet. Nothing to do."
            fi
            publish=false
            needs_tag=false
          else
            needs_tag=true
          fi

          if [ "$publish" = true ] || [ "$needs_tag" = true ]; then
            if ! grep -qx "## $version" CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no '## $version' section."
              exit 1
            fi
          fi

          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tag=$needs_tag" >> "$GITHUB_OUTPUT"
          echo "$name@$version: publish=$publish, tag=$needs_tag"

  check:
    name: check (${{ matrix.os }})
    needs: version
    if: needs.version.outputs.publish == 'true'
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  publish:
    name: Publish v${{ needs.version.outputs.version }}
    needs: [version, check]
    # Runs when either step is outstanding, so a re-run after a failed tag finishes the job.
    if: >-
      always() && needs.version.result == 'success' &&
      (needs.check.result == 'success' || needs.check.result == 'skipped') &&
      (needs.version.outputs.publish == 'true' || needs.version.outputs.tag == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the tag and the GitHub release
      id-token: write # npm trusted publishing
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Publish to npm
        if: needs.version.outputs.publish == 'true'
        run: |
          # Trusted publishing needs npm 11.5.1 or later; Node 22 comes with npm 10.
          npm install -g npm@^11.5.1
          npm ci
          # prepublishOnly runs clean and the full check again before anything is uploaded.
          npm publish

      - name: Tag and release on GitHub
        if: needs.version.outputs.tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$GITHUB_SHA" -m "Wheems $VERSION"
          git push origin "$tag"

          # 0.x versions are early previews.
          prerelease=""
          case "$VERSION" in 0.*|*-*) prerelease="--prerelease" ;; esac
          gh release create "$tag" --verify-tag $prerelease \
            --title "Wheems $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
